<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>גבעות עדן — החיים ביישוב</title>
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2f6b3f; --green2:#3f8a52; --sand:#f6efe2; --stone:#e8dcc4; --ink:#2b2a27; --muted:#6f6a60;
  --gold:#e0a526; --blue:#2d5f9a; --red:#c8553d; --card:#fffdf8; --line:#e2d8c6;
  --shadow:0 6px 24px rgba(40,30,10,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfdcb4;color:var(--ink);font-family:Rubik,system-ui,'Segoe UI',Arial,sans-serif}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-size:15px}
.hidden{display:none!important}
.screen{position:fixed;inset:0}

/* ---------- start ---------- */
#start{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2f6b3f,#6aa36f 55%,#e9d8a6)}
#start .box{background:var(--card);border-radius:24px;padding:28px 24px;width:min(420px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow)}
#start h1{margin:6px 0 4px;font-size:34px;font-weight:800;color:var(--green)}
#start p{margin:0 0 20px;color:var(--muted);line-height:1.5}
.logo{font-size:64px;line-height:1}
.big{display:block;width:100%;padding:15px;font-size:19px;font-weight:700;margin-top:10px;background:var(--green);color:#fff;box-shadow:0 4px 0 #1e4a2b}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #1e4a2b}
.big.alt{background:var(--sand);color:var(--green);box-shadow:0 4px 0 var(--line)}
.credit{font-size:11px;color:var(--muted);margin-top:14px}

/* ---------- setup ---------- */
#setup{overflow:auto;background:var(--sand);padding:20px 16px 40px}
#setup .wrap{max-width:560px;margin:0 auto}
#setup h2{color:var(--green);margin:6px 0 4px;font-size:26px}
#setup .sub{color:var(--muted);margin:0 0 18px}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--green2)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:8px 0 16px}
.choice{background:var(--card);border:2px solid var(--line);padding:14px 10px;text-align:center;border-radius:16px;font-size:15px}
.choice .e{font-size:40px;display:block;margin-bottom:6px}
.choice small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.choice.sel{border-color:var(--green2);background:#e9f4e7;box-shadow:0 0 0 3px #3f8a5233}
label.f{display:block;font-weight:700;margin:12px 0 6px}
input.t,select.t{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-family:inherit;font-size:16px;background:#fff}
.kidrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.kidrow input{flex:1}
.kidrow select{width:90px}

/* ---------- game ---------- */
#game{background:#cfdcb4}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
#map text{font-family:Rubik,system-ui,sans-serif;pointer-events:none}
.bld{cursor:pointer;transition:fill .6s}
.bld:hover{filter:brightness(1.12)}
.fac{cursor:pointer}
.plot{fill:#ffffff55;stroke:#2d5f9a;stroke-width:1.2;stroke-dasharray:3 2;cursor:pointer;animation:pulse 1.2s infinite}
.plot:hover{fill:#2d5f9a55}
@keyframes pulse{50%{fill:#2d5f9a33}}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;background:#fffdf8ee;border-radius:14px;padding:6px 10px;box-shadow:0 2px 10px #0002;font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
.pill small{font-weight:500;color:var(--muted);font-size:11px}
#clock{flex-direction:column;align-items:flex-start;gap:0;padding:5px 12px;min-width:118px}
#clock b{font-size:20px;letter-spacing:.5px;direction:ltr}
#clock.shabbat{background:#3b2f6b;color:#ffe9a8}
#clock.shabbat small{color:#e8d9ff}
#speed{display:flex;gap:3px;padding:4px}
#speed button{background:transparent;padding:4px 7px;font-size:15px;border-radius:9px}
#speed button.on{background:var(--green);color:#fff}
.spacer{flex:1}

#nav{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#fffdf8f2;padding:6px;border-radius:20px;box-shadow:var(--shadow);max-width:calc(100% - 16px);overflow-x:auto}
#nav button{background:transparent;display:flex;flex-direction:column;align-items:center;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);min-width:58px;position:relative}
#nav button span{font-size:24px;line-height:1.1}
#nav button:hover{background:var(--sand)}
#nav button .dot{position:absolute;top:3px;left:8px;width:10px;height:10px;border-radius:50%;background:var(--red)}

#sheet{position:absolute;z-index:20;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;
  bottom:0;left:0;right:0;max-height:78%;border-radius:22px 22px 0 0;animation:up .22s ease-out}
@media(min-width:900px){#sheet{top:62px;bottom:0;right:0;left:auto;width:430px;max-height:none;border-radius:22px 0 0 0;animation:side .22s ease-out}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes side{from{transform:translateX(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:21px;flex:1}
.x{background:var(--sand);width:36px;height:36px;font-size:18px}
.sheet-body{overflow:auto;padding:12px 16px 90px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tabs button{background:var(--sand);padding:7px 12px;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--green);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.item .ic{font-size:30px;width:44px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px}
.item .tx small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.item button,.btn{background:var(--green);color:#fff;padding:9px 12px;font-weight:700;white-space:nowrap}
.item button:disabled,.btn:disabled{background:#c9c3b6;cursor:not-allowed}
.btn.sec{background:var(--sand);color:var(--ink)}
.btn.blue{background:var(--blue)}
.owned{color:var(--green2);font-weight:700;font-size:13px}
.note{background:#fff6dd;border:1px solid #f0dca0;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;line-height:1.45}
.note.red{background:#fde8e2;border-color:#f3c0b3}
.sect{font-weight:800;color:var(--green);margin:14px 0 8px;font-size:15px}
.bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green2)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.room{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;min-height:82px}
.room b{font-size:13px;color:var(--muted)}
.room .things{font-size:26px;letter-spacing:2px;margin-top:4px;line-height:1.25}
.room.empty .things{opacity:.25}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stat b{direction:ltr}

#toasts{position:absolute;top:64px;left:10px;width:min(340px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px;z-index:15;pointer-events:none}
.toast{pointer-events:auto;background:#fffdf8;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px;line-height:1.4;border-right:5px solid var(--green2);animation:tin .25s}
.toast.gold{border-color:var(--gold)} .toast.red{border-color:var(--red)} .toast.blue{border-color:var(--blue)}
.toast .acts{display:flex;gap:6px;margin-top:7px}
.toast .acts button{padding:6px 10px;font-size:13px}
@keyframes tin{from{transform:translateX(-30px);opacity:0}}

#modal{position:fixed;inset:0;z-index:50;background:#1d1a1499;display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--card);border-radius:24px;padding:22px 20px;width:min(440px,100%);max-height:90%;overflow:auto;text-align:center;box-shadow:var(--shadow);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mcard .e{font-size:62px;line-height:1.1}
.mcard h3{margin:8px 0 6px;font-size:23px}
.mcard p{margin:0 0 14px;color:#4b473f;line-height:1.55;font-size:15.5px}
.mcard .acts{display:flex;flex-direction:column;gap:8px}
.mcard .acts button{padding:13px;font-size:16px;font-weight:700}
.mcard.shabbat{background:linear-gradient(#3b2f6b,#5a3f8a);color:#fff}
.mcard.shabbat p{color:#efe6ff}

#banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);z-index:12;display:flex;gap:10px;align-items:center;font-weight:600;max-width:calc(100% - 16px)}
#banner button{background:#fff;color:var(--blue);padding:7px 12px;font-weight:700}
#pick{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 16px));background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);z-index:12}
#pick .row{display:flex;gap:8px}
#pick .row > *{flex:1}
#pick .chosen{margin:8px 0;font-weight:700;font-size:17px;text-align:center;min-height:24px}
.attr{position:absolute;bottom:2px;right:6px;font-size:10px;color:#4a5a3a;opacity:.8;pointer-events:none}
@media(max-width:600px){
  .pill{font-size:12.5px;padding:5px 8px}
  #clock b{font-size:17px}
  #nav{gap:0;padding:5px}
  #nav button{min-width:0;padding:5px 5px;font-size:10.5px}
  #nav button span{font-size:21px}
  #toasts{top:auto;bottom:86px}
  .pill:not(#clock) small{display:none}
  #hud{gap:4px}
}
</style>
</head>
<body>

<div id="start" class="screen">
  <div class="box">
    <img class="logo" src="icons/icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px;box-shadow:0 4px 14px #0003">
    <h1>גבעות עדן</h1>
    <p>החיים האמיתיים ביישוב 🌿<br>אתה ראש היישוב — תפתח אותו, תגדל משפחה ותבנה חיים!</p>
    <button class="big" id="btnNew">🎮 משחק חדש</button>
    <button class="big alt hidden" id="btnCont">▶️ להמשיך מאיפה שעצרתי</button>
    <button class="big alt hidden" id="btnInstall">📲 להתקין כאפליקציה</button>
    <div class="credit">המפה אמיתית — © OpenStreetMap contributors</div>
  </div>
</div>

<div id="setup" class="screen hidden"><div class="wrap" id="setupWrap"></div></div>

<div id="game" class="screen hidden">
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="hud"></div>
  <div id="toasts"></div>
  <div id="nav">
    <button data-p="build"><span>🏗️</span>לבנות</button>
    <button data-p="home"><span>🏠</span>הבית</button>
    <button data-p="family"><span>👨‍👩‍👧</span>משפחה</button>
    <button data-p="drive"><span>🚗</span>לצאת</button>
    <button data-p="town"><span>🏛️</span>היישוב</button>
    <button data-p="missions"><span>📋</span>משימות</button>
    <button data-p="menu"><span>⚙️</span>תפריט</button>
  </div>
  <div id="sheet" class="hidden">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetX">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="attr">© OpenStreetMap contributors</div>
</div>

<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>

<script src="map-data.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
