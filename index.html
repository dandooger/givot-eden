<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>גבעות עדן — החיים ביישוב</title>
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2f6b3f; --green2:#3f8a52; --sand:#f6efe2; --ink:#2b2a27; --muted:#6f6a60;
  --gold:#e0a526; --blue:#2d5f9a; --red:#c8553d; --card:#fffdf8; --line:#e2d8c6;
  --shadow:0 6px 24px rgba(20,15,5,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;color:var(--ink);font-family:Rubik,system-ui,'Segoe UI',Arial,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,select{user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;font-size:15px}
.hidden{display:none!important}
.screen{position:fixed;inset:0}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;touch-action:none;z-index:1}

/* ---------- start ---------- */
#start{display:flex;align-items:center;justify-content:center;z-index:30;background:linear-gradient(180deg,#0000 40%,#0006)}
#start .box{background:#fffdf8f0;border-radius:24px;padding:20px 22px;width:min(400px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
#start h1{margin:4px 0 2px;font-size:32px;font-weight:800;color:var(--green)}
#start p{margin:0 0 12px;color:var(--muted);line-height:1.45;font-size:14.5px}
.logo{width:76px;height:76px;border-radius:20px;box-shadow:0 4px 14px #0003}
.big{display:block;width:100%;padding:13px;font-size:18px;font-weight:700;margin-top:9px;background:var(--green);color:#fff;box-shadow:0 4px 0 #1e4a2b}
.big:disabled{background:#8aa592;box-shadow:0 4px 0 #6b8572}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #1e4a2b}
.big.alt{background:var(--sand);color:var(--green);box-shadow:0 4px 0 var(--line)}
.credit{font-size:10.5px;color:var(--muted);margin-top:10px}
#loadmsg{font-size:13px;color:var(--green2);min-height:18px;margin-top:6px}

/* ---------- setup ---------- */
#setup{overflow:auto;background:var(--sand);padding:16px 16px 40px;z-index:30}
#setup .wrap{max-width:600px;margin:0 auto}
#setup h2{color:var(--green);margin:4px 0 2px;font-size:24px}
#setup .sub{color:var(--muted);margin:0 0 12px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--green2)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:6px 0 12px}
.choice{background:var(--card);border:2px solid var(--line);padding:11px 8px;text-align:center;border-radius:16px;font-size:15px}
.choice .e{font-size:34px;display:block;margin-bottom:4px}
.choice small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
.choice.sel{border-color:var(--green2);background:#e9f4e7;box-shadow:0 0 0 3px #3f8a5233}
label.f{display:block;font-weight:700;margin:10px 0 5px}
input.t,select.t{width:100%;padding:11px;border-radius:12px;border:2px solid var(--line);font-family:inherit;font-size:16px;background:#fff}
.kidrow{display:flex;gap:8px;margin-bottom:8px}
.kidrow input{flex:1}
.kidrow select{width:92px}

/* ---------- game HUD ---------- */
#game{z-index:5;pointer-events:none}
#game > *{pointer-events:auto}
#hud{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));left:150px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-start;pointer-events:none}
.pill{pointer-events:auto;background:#fffdf8e8;border-radius:13px;padding:5px 9px;box-shadow:0 2px 10px #0003;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
#clock{flex-direction:column;align-items:flex-start;gap:0;padding:4px 11px;min-width:104px;cursor:default}
#clock small{font-weight:500;color:var(--muted);font-size:10.5px}
#clock b{font-size:19px;direction:ltr}
#clock.shabbat{background:#3b2f6b;color:#ffe9a8}
#clock.shabbat small{color:#e8d9ff}
#speed{gap:2px;padding:3px}
#speed button{background:transparent;padding:3px 6px;font-size:14px;border-radius:9px}
#speed button.on{background:var(--green);color:#fff}
#menu{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#fffdf8d8;padding:5px;border-radius:16px;box-shadow:0 2px 10px #0003}
#menu button{background:transparent;width:42px;height:40px;font-size:21px;display:flex;align-items:center;justify-content:center;border-radius:11px}
#menu button:hover{background:var(--sand)}
#mini{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));width:132px;height:132px;border-radius:50%;box-shadow:0 3px 12px #0004}
#place{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 138px);left:max(8px,env(safe-area-inset-left));background:#1d1a14b0;color:#fff;font-size:12px;padding:4px 9px;border-radius:10px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#guide{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 56px);left:50%;transform:translateX(-50%);background:#1f5fa8ee;color:#fff;font-weight:700;font-size:14px;padding:6px 8px 6px 12px;border-radius:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);white-space:nowrap}
#guide .arrow{display:inline-block;font-size:20px;transition:transform .1s linear}
#guide button{background:#ffffff33;color:#fff;width:26px;height:26px;border-radius:8px;font-size:13px}
#kidchip{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 98px);left:50%;transform:translateX(-50%);background:#fffdf8;border-radius:12px;padding:4px 10px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
#acts{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.act{background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:12px 18px;border-radius:16px;box-shadow:0 4px 0 #1e4a2b,0 6px 16px #0004;animation:pop .2s}
.act:first-child{background:#1f5fa8;box-shadow:0 4px 0 #143f72,0 6px 16px #0004}
#run{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:calc(max(16px,env(safe-area-inset-right)) + 0px);width:62px;height:62px;border-radius:50%;background:#fffdf8cc;font-size:28px;box-shadow:0 3px 12px #0004}
#acts:not(:empty) ~ #run{bottom:auto;top:50%}
#run.on{background:#f2c14e}
#joyhint{position:absolute;bottom:max(70px,env(safe-area-inset-bottom));left:max(24px,env(safe-area-inset-left));color:#fff;background:#0006;border-radius:14px;padding:8px 12px;font-size:13px;pointer-events:none;animation:fadeout 1s 9s forwards}
@keyframes fadeout{to{opacity:0}}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:#ffffff30;border:3px solid #ffffff90;display:none;z-index:2;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffdf8dd;box-shadow:0 2px 8px #0004}
#toasts{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 96px);right:max(8px,env(safe-area-inset-right));width:min(340px,46%);display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{pointer-events:auto;background:#fffdf8;border-radius:13px;padding:9px 11px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.4;border-right:5px solid var(--green2);animation:tin .25s}
.toast.gold{border-color:var(--gold)} .toast.red{border-color:var(--red)} .toast.blue{border-color:var(--blue)}
.tacts{display:flex;gap:6px;margin-top:6px}
.tacts button{padding:6px 10px;font-size:13px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes pop{from{transform:scale(.8);opacity:0}}

/* ---------- sheet / modal ---------- */
#sheet{position:fixed;z-index:20;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;top:0;bottom:0;right:0;width:min(440px,58%);animation:side .22s ease-out}
@media (orientation:portrait){#sheet{width:100%;top:auto;max-height:80%;border-radius:22px 22px 0 0}}
@keyframes side{from{transform:translateX(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:20px;flex:1}
.x{background:var(--sand);width:36px;height:36px;font-size:18px}
.sheet-body{overflow:auto;padding:10px 14px 40px;user-select:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tabs button{background:var(--sand);padding:7px 12px;white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--green);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:14px;margin-bottom:7px;background:#fff}
.item .ic{font-size:28px;width:42px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15px}
.item .tx small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.item button,.btn{background:var(--green);color:#fff;padding:9px 12px;font-weight:700;white-space:nowrap}
.item button:disabled,.btn:disabled{background:#c9c3b6;cursor:not-allowed}
.btn.sec{background:var(--sand);color:var(--ink)}
.owned{color:var(--green2);font-weight:700;font-size:13px}
.note{background:#fff6dd;border:1px solid #f0dca0;border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:9px;line-height:1.45}
.note.red{background:#fde8e2;border-color:#f3c0b3}
.sect{font-weight:800;color:var(--green);margin:12px 0 7px;font-size:15px}
.bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.rooms{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}
.room{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px;min-height:70px}
.room b{font-size:12px;color:var(--muted)}
.room .things{font-size:23px;letter-spacing:2px;margin-top:3px;line-height:1.25}
.room.empty .things{opacity:.25}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.stat b{direction:ltr}
#modal{position:fixed;inset:0;z-index:50;background:#1d1a1499;display:flex;align-items:center;justify-content:center;padding:12px}
.mcard{background:var(--card);border-radius:22px;padding:16px 18px;width:min(460px,100%);max-height:94%;overflow:auto;text-align:center;box-shadow:var(--shadow);animation:pop .25s}
.mcard .e{font-size:48px;line-height:1.1}
.mcard h3{margin:6px 0 4px;font-size:21px}
.mcard p{margin:0 0 12px;color:#4b473f;line-height:1.5;font-size:15px}
.mcard .acts{display:flex;flex-direction:column;gap:7px}
.mcard .acts button{padding:11px;font-size:15.5px;font-weight:700}
.mcard .acts button small{display:block;font-weight:500;font-size:12px;opacity:.9}
.mcard.list{width:min(560px,100%)}
.mcard.list .acts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mcard.list .acts button:last-child{grid-column:1/-1}
.mcard.shabbat{background:linear-gradient(#3b2f6b,#5a3f8a);color:#fff}
.mcard.shabbat p{color:#efe6ff}
#banner{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border-radius:16px;padding:9px 13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:600;max-width:calc(100% - 16px);z-index:12}
#banner button{background:#fff;color:var(--blue);padding:7px 12px;font-weight:700}
#pick{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));width:min(380px,calc(100% - 16px));background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
#pick .row{display:flex;gap:8px}
#pick .row > *{flex:1}
#pick .chosen{margin:6px 0;font-weight:700;font-size:16px;text-align:center;min-height:22px}
body.inside #mini{display:none}
#menu button{position:relative}
#menu button[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:-4px;left:-4px;background:#25d366;color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.shoprow{display:flex;gap:8px;margin-bottom:8px}
.shoprow input{flex:1}
.shopprev{min-height:22px;font-size:15px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips button{background:var(--sand);padding:6px 10px;font-size:13.5px;font-weight:600}
.chatg{cursor:pointer}
.unread{background:#25d366;color:#fff;font-weight:800;font-size:12px;border-radius:10px;padding:2px 8px}
.chatbox{background:#efe7dd;border-radius:14px;padding:10px;height:min(52vh,420px);overflow-y:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.msg{background:#fff;border-radius:12px 12px 12px 3px;padding:6px 10px;max-width:82%;align-self:flex-start;font-size:14px;line-height:1.35;box-shadow:0 1px 2px #0002}
.msg b{display:block;font-size:12px;color:#1f7a55}
.msg small{display:block;font-size:10px;color:#8a8a8a;text-align:left}
.msg.me{background:#d9fdd3;align-self:flex-end;border-radius:12px 12px 3px 12px}
#fade{position:fixed;inset:0;z-index:45;background:#0b1020;color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:.93;pointer-events:auto}
#game .attr{pointer-events:none}
.attr{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:9.5px;color:#fff;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#2f6b3f;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;padding:30px}
#rotate .ph{font-size:70px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){ body.playing #rotate{display:flex} }
body.picking #mini, body.picking #place, body.picking #joyhint, body.picking #run, body.picking #menu{display:none}
@media (max-height:430px){
  #mini{width:104px;height:104px}
  #place{top:calc(max(8px,env(safe-area-inset-top)) + 110px)}
  #hud{left:118px}
  #menu button{width:36px;height:34px;font-size:18px}
  #hStars{display:none}
  .pill{font-size:12px;padding:4px 7px}
  #clock b{font-size:16px}
  .act{font-size:14.5px;padding:10px 14px}
  #toasts{top:auto;bottom:10px;right:auto;left:50%;transform:translateX(-50%);width:min(360px,44%)}
}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="touch"></div>
<div id="joy"><div id="knob"></div></div>

<div id="start" class="screen">
  <div class="box">
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>גבעות עדן</h1>
    <p>החיים האמיתיים ביישוב 🌿 — ללכת ברחובות, לנהוג, לבנות ולגדל משפחה. אתה ראש היישוב!</p>
    <button class="big" id="btnNew" disabled>⏳ טוען את היישוב...</button>
    <button class="big alt hidden" id="btnCont">▶️ להמשיך מאיפה שעצרתי</button>
    <button class="big alt hidden" id="btnInstall">📲 להתקין כאפליקציה</button>
    <div id="loadmsg"></div>
    <div class="credit">בתים, רחובות וגובה השטח אמיתיים — © OpenStreetMap contributors</div>
  </div>
</div>

<div id="setup" class="screen hidden"><div class="wrap" id="setupWrap"></div></div>

<div id="game" class="screen hidden">
  <canvas id="mini" width="132" height="132"></canvas>
  <div id="place"></div>
  <div id="hud"></div>
  <div id="menu">
    <button data-p="build" title="לבנות">🏗️</button>
    <button data-p="home" title="הבית">🏠</button>
    <button data-p="shop" title="חנות ותיק">🛒</button>
    <button data-p="chat" title="וואטסאפ">💬</button>
    <button data-p="family" title="משפחה">👨‍👩‍👧</button>
    <button data-p="town" title="היישוב">🏛️</button>
    <button data-p="missions" title="משימות">📋</button>
    <button data-p="view" title="מבט מהעיניים / מאחור">👁️</button>
    <button data-p="menu" title="תפריט">⚙️</button>
  </div>
  <div id="guide" class="hidden"></div>
  <div id="kidchip" class="hidden"></div>
  <div id="toasts"></div>
  <div id="acts"></div>
  <button id="run" title="לרוץ">🏃</button>
  <div id="joyhint">🕹️ גרור כאן כדי ללכת</div>
  <div class="attr">© OpenStreetMap contributors</div>
</div>

<div id="sheet" class="hidden">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" id="sheetX">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>
<div id="fade"></div>
<div id="rotate"><div class="ph">📱</div><div>סובב את הטלפון לרוחב 🔄</div><small style="font-weight:500;margin-top:8px;opacity:.85">המשחק עובד הכי טוב כשהמסך לרוחב</small></div>

<script src="map-data.js"></script>
<script src="terrain.js"></script>
<script src="data.js"></script>
<script src="catalog.js"></script>
<script src="life.js"></script>
<script src="inside.js"></script>
<script src="chat.js"></script>
<script type="module">
import { buildWorld } from './world3d.js';
const msg = document.getElementById('loadmsg');
try {
  await buildWorld(t => (msg.textContent = t));
  msg.textContent = '';
  W3.start();
  window.bootLife();
} catch (e) {
  msg.textContent = '😬 משהו השתבש בטעינה: ' + e.message;
  console.error(e);
}
// run button (hold to run)
const run = document.getElementById('run');
const setRun = v => { W3.setRun && W3.setRun(v); run.classList.toggle('on', v); };
run.addEventListener('pointerdown', e => { e.preventDefault(); setRun(!run.classList.contains('on')); });
</script>
</body>
</html>
